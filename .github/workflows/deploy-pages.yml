name: Publicar Sistema Avelon
on:
  push:
    branches: [main]
    paths:
      - avelon-source.zip
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Importar estrutura inicial
        if: hashFiles('dist/index.html') == ''
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('avelon-source.zip') as archive:
              for member in archive.infolist():
                  target = (root / member.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError('Caminho inválido no pacote')
              archive.extractall(root)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist supabase docs README.md .gitignore
          git commit -m 'feat: organizar módulos do Sistema Avelon'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir JavaScript
        run: find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
