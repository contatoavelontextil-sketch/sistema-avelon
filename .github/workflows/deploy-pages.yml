name: Publicar Sistema Avelon
on:
  push:
    branches: [main]
    paths:
      - avelon-v2.zip
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Importar atualização autorizada
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          package = root / 'avelon-v2.zip'
          marker = root / '.source-import-sha'
          if package.exists():
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              if not marker.exists() or marker.read_text().strip() != digest:
                  with zipfile.ZipFile(package) as archive:
                      for member in archive.infolist():
                          target = (root / member.filename).resolve()
                          allowed = member.filename.split('/')[0] in ('dist','supabase','docs','tests','README.md','.gitignore')
                          if not target.is_relative_to(root) or not allowed:
                              raise RuntimeError('Caminho inválido no pacote')
                      archive.extractall(root)
                  marker.write_text(digest + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist supabase docs tests README.md .gitignore .source-import-sha 2>/dev/null || git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrar produção, financeiro, conciliação e configurações'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir JavaScript
        run: find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Testar regras de negócio
        run: if [ -f tests/business.test.mjs ]; then node --test tests/business.test.mjs; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
